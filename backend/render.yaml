services:
  - type: web
    name: osnit-api
    runtime: node
    plan: free
    buildCommand: |
      npm install
      npx prisma generate
      npx prisma db push
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
